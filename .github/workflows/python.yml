name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-format:
    name: Tests and Ruff formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.14.2'
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check --diff .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
